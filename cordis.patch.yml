# dsh-maestro-memory bundle patch: inserts the host row into the profile's
# plugin roster. The browser half rides the package's `dsh.client` manifest
# (the client registry serves lib/client.js), and this row materializes the
# Maestro memory / todos host plugin on boot.
# Install with `dsh plugin --profile <name> add <path-or-git-url>`; the bundle
# patch is applied automatically, so do NOT insert this row again in the
# profile patch (duplicate ids crash the loader).
- insert:
    - id: maestro-memory
      name: '@ddtcorex/dsh-maestro-memory'
      # rpc.handle registers a webServer route inside an effect fiber which carries
      # only the row's inject (not the module's); without webServer the row fails
      # on harnesses that provide webServer after rows apply (DSH 0.1.5-rc.1+); on DSH 0.2.x it is not sufficient on its own, see the `connection` entry at the end of this file.
      inject: ['tools', 'systemPrompt', 'connection', 'sessions', 'webServer']
      config:
        memoryDir: null
        snapshotOrder: 500

# DSH 0.2.x resolves `webServer` for `ctx.connection.rpc.handle` on the
# `connection` row own fiber, so a row-level inject cannot reach it. `inject`
# replaces the base list, hence `webRuntime` (the base row needs it for
# trustedHosts) is repeated. Identical in every maestro package that registers
# RPC channels, so each one stays installable alone.
- id: connection
  inject:
    - webRuntime
    - webServer
