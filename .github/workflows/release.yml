name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: ddtcorex/dsh-maestro-ci/.github/workflows/node-release.yml@22511d64e0dec4e5926388848a347973ec2e3b12
    with:
      pnpm-version: ""
    secrets:
      npm-token: ${{ secrets.NPM_TOKEN }}
